name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python experiments/evaluate.py
      - run: python experiments/evaluate_retrieval.py
      - run: python experiments/evaluate_confidence.py
      - run: python -m py_compile app.py confidence.py verification.py ingestion.py experiments/evaluate.py experiments/evaluate_retrieval.py experiments/evaluate_confidence.py
      - run: docker build -t p1-agentic-platform:${{ github.sha }} .



